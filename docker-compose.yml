version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: family-tasks-db
    environment:
      POSTGRES_USER: family_tasks_user
      POSTGRES_PASSWORD: family_tasks_password
      POSTGRES_DB: family_tasks
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tasks_user -d family_tasks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
